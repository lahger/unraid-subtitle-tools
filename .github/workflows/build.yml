name: Build images

on:
  push:
    branches: [main]
    paths:
      - "subtitleedit/**"
      - "mkv-autosub/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: subtitleedit
            image: subtitleedit-nvidia
            description: Subtitle Edit in a browser desktop with NVIDIA GPU support
          - context: mkv-autosub
            image: mkv-autosub
            description: Automatic OCR of Blu-ray subtitles to SRT and remux with mkvmerge
    steps:
      - uses: actions/checkout@v7

      - name: Read Subtitle Edit version from the Dockerfile
        id: se
        run: echo "version=$(sed -n 's/^ARG SE_VERSION=v//p' ${{ matrix.context }}/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=se-${{ steps.se.outputs.version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
